<script>

    chips:[['cp','Digit-by-digit'],['ct','Tight flag'],['cb','Memoization'],['ca','f(R)−f(L−1)']],
    intuition:[
      {cls:'ins-p',t:'Core idea',b:'Build numbers digit-by-digit from MSB. At each position, decide which digit to place. A <strong>tight</strong> flag ensures we never exceed the upper bound. The <strong>started</strong> flag handles leading zeros.'},
      {cls:'ins-t',t:'f(R) − f(L−1) trick',b:'Always reduce to counting in [0, X]. Answer for [L, R] = count(R) − count(L−1). This simplification is universal for all Digits DP problems.'},
      {cls:'ins-a',t:'Why memoize only tight=false',b:'When tight=true, future digit limits change path-by-path. Only when tight=false are all remaining digits fully free (0–9), making the subproblem reusable.'},
      {cls:'ins-c',t:'State signature',b:'dp[pos][started][rem] where rem = digitSum % K. Add extra dimensions for each property you track.'}
    ],
    phases:[
      {n:'1',col:'var(--p1)',t:'Represent N as string',d:'Convert upper bound to char array. Each char gives digit limit at that position.'},
      {n:'2',col:'var(--p1)',t:'Recurse pos by pos',d:'At each pos try digits 0..limit. Pass (tight, started, state) forward.'},
      {n:'3',col:'var(--p1)',t:'Base case',d:'pos == len → check if the number satisfies property. Return 1 or 0.'},
      {n:'4',col:'var(--p1)',t:'Memoize free states',d:'Cache only when tight=false. On tight path, compute fresh each time.'}
    ],
    code:`import java.util.*;

public class DigitsDP {
    static char[] num;  // ① upper bound as char array
    static int K;       // ② divisor
    // ③ dp[pos][started][rem] — only free (tight=false) states
    static int[][][] dp;

    // ④ pos=current digit index, tight=still bounded by N,
    //    started=non-zero digit seen, rem=digitSum%K so far
    static int solve(int pos, boolean tight,
                     boolean started, int rem) {
        if (pos == num.length) {             // ⑤ base case
            return (started && rem == 0) ? 1 : 0;
        }
        // ⑥ memoize ONLY free paths (tight=false)
        if (!tight && dp[pos][started?1:0][rem] != -1)
            return dp[pos][started?1:0][rem];

        int limit = tight ? (num[pos] - '0') : 9; // ⑦ max digit
        int res = 0;

        for (int d = 0; d <= limit; d++) {   // ⑧ try each digit
            boolean nTight   = tight && (d == limit); // ⑨
            boolean nStarted = started || (d != 0);   // ⑩
            // ⑪ accumulate sum only after first non-zero digit
            int nRem = nStarted ? (rem + d) % K : 0;
            res += solve(pos + 1, nTight, nStarted, nRem);
        }
        // ⑫ store result for free path
        if (!tight) dp[pos][started?1:0][rem] = res;
        return res;
    }

    static int count(long X) {
        num = Long.toString(X).toCharArray();
        // ⑬ reset dp before each call (num changes!)
        dp = new int[num.length][2][K];
        for (int[][] a : dp) for (int[] b : a) Arrays.fill(b, -1);
        return solve(0, true, false, 0); // ⑭ start state
    }

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);
        long L = sc.nextLong(), R = sc.nextLong();
        K = sc.nextInt();
        System.out.println(count(R) - count(L - 1)); // ⑮
    }
}`,
    anns:[
      {n:'①③',bg:'var(--p2)',c:'var(--p3)',t:'<strong>State array:</strong> dp[pos][started][rem]. pos = 0..19 (20 digits for Long.MAX_VALUE). started = 0/1. rem = 0..K-1. Total: 20 × 2 × K states.'},
      {n:'⑤',bg:'var(--t2)',c:'var(--t3)',t:'<strong>Base case:</strong> All digits placed. Return 1 only if number actually started (not all zeros) AND digit sum is divisible by K (rem == 0).'},
      {n:'⑥⑫',bg:'var(--a2)',c:'var(--a3)',t:'<strong>Memoization guard:</strong> Cache only when tight=false. When tight=true, each path has different per-position limits — the same (pos, rem) with different tight histories may have different futures.'},
      {n:'⑨',bg:'var(--c2)',c:'var(--c3)',t:'<strong>nTight transition:</strong> Stay tight only if d equals the current limit. Place any digit strictly less than limit → all future positions become free forever.'},
      {n:'⑪',bg:'var(--b2)',c:'var(--b3)',t:'<strong>Leading zero guard:</strong> Only accumulate digit d into rem after nStarted is true. Leading zeros don\'t count toward digit sum.'},
      {n:'⑬',bg:'var(--p2)',c:'var(--p3)',t:'<strong>Reset between calls:</strong> count(R) and count(L-1) use different num arrays. Previously cached states are relative to old num — must reset dp before each top-level call.'}
    ],

        {states:{pos:1,tight:'false',started:'true',rem:1,d:'0–9'},arr:[1,0],hi:[1],log:'pos=1, started=T\nd=2 → (1+2)%3=0 ✓ (12)\nd=5 → (1+5)%3=0 ✓ (15)\nd=8 → (1+8)%3=0 ✓ (18)\nResult cached: dp[1][1][1]=3'},

    intuition:[
      {cls:'ins-c',t:'Core idea',b:'Make the locally optimal choice at each step. Greedy works when the <strong>greedy choice property</strong> holds: the locally best choice is always part of some globally optimal solution.'},
      {cls:'ins-p',t:'How to prove greedy is correct',b:'Use the <strong>exchange argument</strong>: assume an optimal solution differs from greedy. Show you can swap the differing part to match greedy without worsening the result. Repeat until identical.'},
      {cls:'ins-t',t:'The 80% rule',b:'Most greedy problems begin with <strong>sorting by the greedy criterion</strong>. Sort by end time for intervals, by value/weight for knapsack, by deadline for scheduling. The sort reveals the order of picking.'},
      {cls:'ins-a',t:'When greedy fails',b:'Greedy fails when a local choice forecloses a globally better path. Classic trap: coin change with arbitrary denominations. Always verify with a counterexample or exchange proof.'}
    ],
    phases:[
      {n:'1',col:'var(--c1)',t:'Define the criterion',d:'What makes one item better than another? Formalize it as a comparator.'},
      {n:'2',col:'var(--c1)',t:'Sort by criterion',d:'Sort items/intervals/jobs by the greedy key.'},
      {n:'3',col:'var(--c1)',t:'Scan and pick',d:'Iterate sorted items. Greedily pick if it doesn\'t violate constraints.'},
      {n:'4',col:'var(--c1)',t:'Update state',d:'Update current state (last end time, remaining capacity, etc.) after each pick.'}
    ],
    code:`import java.util.*;

public class GreedyTemplates {

    // ── Template 1: Activity Selection (Max non-overlapping intervals) ──
    // Sort by END time — always take the interval ending earliest
    static int activitySelection(int[][] intervals) {
        // ① sort by end time (greedy criterion)
        Arrays.sort(intervals, (a, b) -> a[1] - b[1]);
        int count = 1;
        int lastEnd = intervals[0][1]; // ② track last chosen end

        for (int i = 1; i < intervals.length; i++) {
            if (intervals[i][0] >= lastEnd) { // ③ no overlap
                count++;
                lastEnd = intervals[i][1];    // ④ update state
            }
        }
        return count;
    }

    // ── Template 2: Fractional Knapsack ──
    // Sort by value/weight ratio descending — take most valuable fraction first
    static double fractionalKnapsack(int W, int[] wt, int[] val) {
        int n = wt.length;
        Integer[] idx = new Integer[n];
        for (int i = 0; i < n; i++) idx[i] = i;
        // ⑤ sort by value/weight ratio descending
        Arrays.sort(idx, (a, b) ->
            Double.compare((double)val[b]/wt[b], (double)val[a]/wt[a]));

        double profit = 0;
        int remaining = W;
        for (int i : idx) {
            if (remaining >= wt[i]) {          // ⑥ take whole item
                profit += val[i];
                remaining -= wt[i];
            } else {                           // ⑦ take fraction
                profit += (double) val[i] * remaining / wt[i];
                break;
            }
        }
        return profit;
    }

    // ── Template 3: Jump Game II (Min jumps) ──
    // Greedy: from current window, maximize reach; advance window
    static int minJumps(int[] nums) {
        int jumps = 0, curEnd = 0, farthest = 0;
        for (int i = 0; i < nums.length - 1; i++) {
            farthest = Math.max(farthest, i + nums[i]); // ⑧ expand reach
            if (i == curEnd) {    // ⑨ must jump — end of current window
                jumps++;
                curEnd = farthest;
            }
        }
        return jumps;
    }

    // ── Template 4: Interval Merge / Scheduling ──
    static int[][] mergeIntervals(int[][] intervals) {
        Arrays.sort(intervals, (a, b) -> a[0] - b[0]); // ⑩ sort by start
        List<int[]> res = new ArrayList<>();
        int[] cur = intervals[0];
        for (int i = 1; i < intervals.length; i++) {
            if (intervals[i][0] <= cur[1])         // ⑪ overlapping
                cur[1] = Math.max(cur[1], intervals[i][1]);
            else { res.add(cur); cur = intervals[i]; }
        }
        res.add(cur);
        return res.toArray(new int[0][]);
    }
}`,
    anns:[
      {n:'①',bg:'var(--c2)',c:'var(--c3)',t:'<strong>Sort is the greedy key:</strong> For activity selection, sorting by end time is the correct criterion — the exchange argument shows that replacing any early-ending selection with a later one never improves the count.'},
      {n:'②④',bg:'var(--t2)',c:'var(--t3)',t:'<strong>State tracking:</strong> lastEnd is the only state needed. After picking an interval, update lastEnd to its end time. Next interval is valid iff its start ≥ lastEnd.'},
      {n:'⑤',bg:'var(--p2)',c:'var(--p3)',t:'<strong>Fractional knapsack criterion:</strong> value/weight ratio. This is the correct greedy key because taking the highest-ratio fraction first maximizes value per unit weight.'},
      {n:'⑧⑨',bg:'var(--a2)',c:'var(--a3)',t:'<strong>Jump Game II insight:</strong> Think of it as BFS levels. Within the current jump window [prev_end+1, curEnd], find the farthest reachable index. When you reach curEnd, you MUST use a jump — advance to farthest.'},
      {n:'⑩⑪',bg:'var(--b2)',c:'var(--b3)',t:'<strong>Merge intervals:</strong> Sort by start. Merge when next interval\'s start ≤ current end. The max of the two ends handles containment (one interval completely inside another).'}

    code:`import java.util.*;

public class PrefixSum {

    // ── Template 1: 1D prefix sum (range queries) ──
    static int[] buildPrefix(int[] arr) {
        int n = arr.length;
        int[] pre = new int[n + 1]; // ① size n+1, pre[0]=0
        for (int i = 0; i < n; i++)
            pre[i + 1] = pre[i] + arr[i]; // ② accumulate
        return pre;
    }
    // ③ range sum [l, r] inclusive (0-indexed)
    static int rangeSum(int[] pre, int l, int r) {
        return pre[r + 1] - pre[l];
    }

    // ── Template 2: Subarray sum equals K (HashMap trick) ──
    static int subarraySumK(int[] arr, int k) {
        Map<Integer, Integer> freq = new HashMap<>();
        freq.put(0, 1); // ④ empty prefix has sum 0
        int cur = 0, ans = 0;
        for (int x : arr) {
            cur += x;
            // ⑤ how many prefixes end at cur - k?
            ans += freq.getOrDefault(cur - k, 0);
            freq.merge(cur, 1, Integer::sum); // ⑥ record this prefix
        }
        return ans;
    }

    // ── Template 3: 2D prefix sum (submatrix queries) ──
    static int[][] build2D(int[][] mat) {
        int m = mat.length, n = mat[0].length;
        int[][] p = new int[m + 1][n + 1]; // ⑦ 1-indexed
        for (int i = 1; i <= m; i++)
            for (int j = 1; j <= n; j++)
                // ⑧ inclusion-exclusion formula
                p[i][j] = mat[i-1][j-1] + p[i-1][j]
                         + p[i][j-1] - p[i-1][j-1];
        return p;
    }
    // ⑨ submatrix sum from (r1,c1) to (r2,c2) — 0-indexed input
    static int submatrix(int[][] p, int r1,int c1,int r2,int c2){
        return p[r2+1][c2+1] - p[r1][c2+1]
             - p[r2+1][c1] + p[r1][c1];
    }

    // ── Template 4: Prefix XOR (subarray XOR queries) ──
    static int subarrayXorK(int[] arr, int k) {
        Map<Integer, Integer> freq = new HashMap<>();
        freq.put(0, 1);
        int xor = 0, ans = 0;
        for (int x : arr) {
            xor ^= x;                              // ⑩ running XOR
            ans += freq.getOrDefault(xor ^ k, 0); // ⑪ complement
            freq.merge(xor, 1, Integer::sum);
        }
        return ans;
    }
}`,

    code:`import java.util.*;

public class SlidingWindow {

    // ── Template 1: Fixed window of size k ──
    static int maxSumFixed(int[] arr, int k) {
        int n = arr.length;
        int windowSum = 0;
        for (int i = 0; i < k; i++) windowSum += arr[i]; // ① seed
        int maxSum = windowSum;
        for (int r = k; r < n; r++) {
            windowSum += arr[r] - arr[r - k]; // ② slide: add right, remove left
            maxSum = Math.max(maxSum, windowSum);
        }
        return maxSum;
    }

    // ── Template 2: Variable window — longest valid subarray ──
    // Example: longest subarray with at most K distinct characters
    static int longestAtMostKDistinct(String s, int k) {
        Map<Character, Integer> freq = new HashMap<>();
        int l = 0, ans = 0;
        for (int r = 0; r < s.length(); r++) {
            // ③ expand: add s[r] to window
            freq.merge(s.charAt(r), 1, Integer::sum);
            // ④ shrink while constraint violated (> k distinct)
            while (freq.size() > k) {
                char lc = s.charAt(l++);
                freq.merge(lc, -1, Integer::sum);
                if (freq.get(lc) == 0) freq.remove(lc); // ⑤ clean up
            }
            ans = Math.max(ans, r - l + 1); // ⑥ valid window
        }
        return ans;
    }

    // ── Template 3: Minimum window substring (LC 76) ──
    static String minWindow(String s, String t) {
        int[] need = new int[128], have = new int[128];
        for (char c : t.toCharArray()) need[c]++;
        int formed = 0, required = 0;
        for (int x : need) if (x > 0) required++; // ⑦ distinct chars needed
        int l = 0, minLen = Integer.MAX_VALUE, start = 0;
        for (int r = 0; r < s.length(); r++) {
            char rc = s.charAt(r);
            have[rc]++;
            if (need[rc] > 0 && have[rc] == need[rc]) formed++; // ⑧ satisfied
            while (formed == required) { // ⑨ try to shrink
                if (r - l + 1 < minLen) { minLen = r - l + 1; start = l; }
                char lc = s.charAt(l++);
                have[lc]--;
                if (need[lc] > 0 && have[lc] < need[lc]) formed--;
            }
        }
        return minLen == Integer.MAX_VALUE ? "" : s.substring(start, start+minLen);
    }

    // ── Template 4: Sliding window maximum (Monotonic deque) ──
    static int[] maxInWindows(int[] arr, int k) {
        Deque<Integer> dq = new ArrayDeque<>(); // ⑩ stores indices
        int n = arr.length;
        int[] res = new int[n - k + 1];
        for (int r = 0; r < n; r++) {
            // ⑪ remove elements outside window
            while (!dq.isEmpty() && dq.peekFirst() < r - k + 1)
                dq.pollFirst();
            // ⑫ maintain decreasing order (remove smaller from back)
            while (!dq.isEmpty() && arr[dq.peekLast()] < arr[r])
                dq.pollLast();
            dq.addLast(r);
            if (r >= k - 1) res[r - k + 1] = arr[dq.peekFirst()];
        }
        return res;
    }
}`,

    code:`import java.util.*;

public class Kadane {

    // ── Template 1: Classic Kadane — max subarray sum ──
    static int maxSubarray(int[] arr) {
        int curSum = arr[0], maxSum = arr[0]; // ① start at arr[0] (handles all-negative)
        for (int i = 1; i < arr.length; i++) {
            // ② extend previous OR start fresh — the core decision
            curSum = Math.max(arr[i], curSum + arr[i]);
            maxSum = Math.max(maxSum, curSum);  // ③ track global best
        }
        return maxSum;
    }

    // ── With indices (track start and end of max subarray) ──
    static int[] maxSubarrayWithIndices(int[] arr) {
        int curSum = arr[0], maxSum = arr[0];
        int start = 0, end = 0, tempStart = 0;
        for (int i = 1; i < arr.length; i++) {
            if (arr[i] > curSum + arr[i]) { // ④ restart fresh at i
                curSum = arr[i];
                tempStart = i;              // ⑤ potential new start
            } else {
                curSum += arr[i];
            }
            if (curSum > maxSum) {
                maxSum = curSum;
                start = tempStart;          // ⑥ confirm start/end on improvement
                end = i;
            }
        }
        return new int[]{maxSum, start, end};
    }

    // ── Template 2: Max product subarray ──
    static int maxProduct(int[] arr) {
        int maxP = arr[0], minP = arr[0], res = arr[0];
        for (int i = 1; i < arr.length; i++) {
            // ⑦ swap because multiplying negative flips max↔min
            if (arr[i] < 0) { int tmp = maxP; maxP = minP; minP = tmp; }
            maxP = Math.max(arr[i], maxP * arr[i]); // ⑧ extend or restart
            minP = Math.min(arr[i], minP * arr[i]);
            res = Math.max(res, maxP);
        }
        return res;
    }

    // ── Template 3: Max circular subarray sum ──
    static int maxCircular(int[] arr) {
        int totalSum = 0;
        int curMax = arr[0], maxSum = arr[0];
        int curMin = arr[0], minSum = arr[0];
        for (int x : arr) {
            totalSum += x;
            curMax = Math.max(x, curMax + x);    // ⑨ normal Kadane for max
            maxSum = Math.max(maxSum, curMax);
            curMin = Math.min(x, curMin + x);    // ⑩ Kadane for min subarray
            minSum = Math.min(minSum, curMin);
        }
        // ⑪ if all elements negative, circular case = empty array → use linear
        return maxSum > 0 ? Math.max(maxSum, totalSum - minSum) : maxSum;
    }

    // ── Template 4: Max subarray after one deletion ──
    static int maxAfterDeletion(int[] arr) {
        int n = arr.length;
        int[] fwd = new int[n], bwd = new int[n]; // ⑫ forward and backward Kadane
        fwd[0] = arr[0];
        for (int i = 1; i < n; i++)
            fwd[i] = Math.max(arr[i], fwd[i-1] + arr[i]);
        bwd[n-1] = arr[n-1];
        for (int i = n-2; i >= 0; i--)
            bwd[i] = Math.max(arr[i], bwd[i+1] + arr[i]);
        int ans = Arrays.stream(arr).max().getAsInt(); // ⑬ no deletion case
        for (int i = 1; i < n-1; i++)                 // ⑭ delete index i
            ans = Math.max(ans, fwd[i-1] + bwd[i+1]);
        return ans;
    }
}`,

    code:`import java.util.*;

public class BitmaskDP {

    // ── Template 1: Travelling Salesman Problem (TSP) ──
    // Find minimum cost Hamiltonian path visiting all n cities
    static int tsp(int[][] dist) {
        int n = dist.length;
        int FULL = (1 << n) - 1;           // ① all cities visited
        // ② dp[mask][i] = min cost to visit exactly cities in mask, ending at i
        int[][] dp = new int[1 << n][n];
        for (int[] row : dp) Arrays.fill(row, Integer.MAX_VALUE / 2);
        dp[1][0] = 0;                       // ③ start at city 0, mask = 001

        for (int mask = 1; mask <= FULL; mask++) {
            for (int u = 0; u < n; u++) {
                if ((mask & (1 << u)) == 0) continue; // ④ u must be in mask
                if (dp[mask][u] == Integer.MAX_VALUE / 2) continue;
                for (int v = 0; v < n; v++) {
                    if ((mask & (1 << v)) != 0) continue; // ⑤ v not yet visited
                    int nMask = mask | (1 << v);           // ⑥ add v to visited set
                    dp[nMask][v] = Math.min(dp[nMask][v],
                                            dp[mask][u] + dist[u][v]);
                }
            }
        }
        int ans = Integer.MAX_VALUE;
        for (int u = 1; u < n; u++)            // ⑦ return to start from any endpoint
            ans = Math.min(ans, dp[FULL][u] + dist[u][0]);
        return ans;
    }

    // ── Template 2: Minimum cost assignment (bipartite matching) ──
    // n workers, n tasks — assign each task to a worker
    static int minCostAssign(int[][] cost) {
        int n = cost.length;
        int[] dp = new int[1 << n];
        Arrays.fill(dp, Integer.MAX_VALUE / 2);
        dp[0] = 0;
        for (int mask = 0; mask < (1 << n); mask++) {
            if (dp[mask] == Integer.MAX_VALUE / 2) continue;
            int worker = Integer.bitCount(mask); // ⑧ next worker = popcount(mask)
            if (worker == n) continue;
            for (int task = 0; task < n; task++) {
                if ((mask & (1 << task)) != 0) continue; // ⑨ task already assigned
                dp[mask | (1 << task)] = Math.min(
                    dp[mask | (1 << task)],
                    dp[mask] + cost[worker][task]     // ⑩ assign task to worker
                );
            }
        }
        return dp[(1 << n) - 1];
    }

    // ── Template 3: Enumerate all subsets of a mask ──
    static void enumerateSubsets(int mask) {
        for (int sub = mask; sub > 0; sub = (sub - 1) & mask) {
            // ⑪ process sub (a subset of mask)
            // sub goes through all 2^popcount(mask) subsets
        }
        // ⑫ process empty subset separately (sub=0 falls out of loop)
    }

    // ── Template 4: Shortest path visiting all nodes (BFS + bitmask) ──
    static int shortestPathAll(int[][] graph) {
        int n = graph.length;
        int FULL = (1 << n) - 1;
        int[][] dist = new int[1 << n][n];
        for (int[] r : dist) Arrays.fill(r, Integer.MAX_VALUE);
        Queue<int[]> q = new LinkedList<>();
        for (int i = 0; i < n; i++) {       // ⑬ start from any node
            dist[1 << i][i] = 0;
            q.offer(new int[]{1 << i, i});
        }
        while (!q.isEmpty()) {
            int[] cur = q.poll();
            int mask = cur[0], u = cur[1];
            if (mask == FULL) return dist[mask][u];
            for (int v : graph[u]) {         // ⑭ traverse neighbors
                int nMask = mask | (1 << v);
                if (dist[nMask][v] == Integer.MAX_VALUE) {
                    dist[nMask][v] = dist[mask][u] + 1;
                    q.offer(new int[]{nMask, v});
                }
            }
        }
        return -1;
    }
}`,

    code:`import java.util.*;

public class StateMachineDP {

    // ── Template: Stock with cooldown (3 states) ──
    // States: HOLD (own stock), SOLD (just sold today), REST (no stock, no sell)
    //
    // State diagram:
    //  REST ──buy──→ HOLD ──sell──→ SOLD
    //   ↑                              │
    //   └──────────────────────────────┘ (cooldown: SOLD→REST next day)
    //   REST ──────────────────────────→ REST (do nothing)
    //   HOLD ──────────────────────────→ HOLD (hold)

    static int maxProfitCooldown(int[] prices) {
        int n = prices.length;
        // ① one variable per state (space-optimized, O(1) space)
        int hold = -prices[0]; // ② max profit while holding stock
        int sold = 0;          // ③ max profit day we sell
        int rest = 0;          // ④ max profit while resting (no stock)

        for (int i = 1; i < n; i++) {
            int prevHold = hold, prevSold = sold, prevRest = rest;
            // ⑤ HOLD: either stayed holding, or bought today from REST
            hold = Math.max(prevHold, prevRest - prices[i]);
            // ⑥ SOLD: sold today (must have been holding)
            sold = prevHold + prices[i];
            // ⑦ REST: either stayed resting, or came from SOLD (cooldown)
            rest = Math.max(prevRest, prevSold);
        }
        return Math.max(sold, rest); // ⑧ can't end in HOLD (must sell)
    }

    // ── General K transactions template ──
    static int maxProfitK(int k, int[] prices) {
        int n = prices.length;
        if (k >= n / 2) {           // ⑨ unlimited transactions case
            int profit = 0;
            for (int i = 1; i < n; i++)
                if (prices[i] > prices[i-1])
                    profit += prices[i] - prices[i-1];
            return profit;
        }
        // ⑩ dp[t][0] = max profit with t transactions, not holding
        //    dp[t][1] = max profit with t transactions, currently holding
        int[][] dp = new int[k + 1][2];
        for (int[] row : dp) Arrays.fill(row, Integer.MIN_VALUE / 2);
        dp[0][0] = 0; // ⑪ 0 transactions completed, not holding → profit 0

        for (int price : prices) {
            // ⑫ iterate backwards to avoid using same day twice
            for (int t = k; t >= 1; t--) {
                // sell: complete transaction t, profit += price
                dp[t][0] = Math.max(dp[t][0], dp[t][1] + price);
                // buy: start using transaction t (costs price)
                dp[t][1] = Math.max(dp[t][1], dp[t-1][0] - price);
            }
        }
        return dp[k][0]; // ⑬ k transactions done, not holding
    }

    // ── Regex matching state machine (LC 10) ──
    static boolean isMatch(String s, String p) {
        int m = s.length(), n = p.length();
        // ⑭ dp[i][j] = can s[0..i-1] be matched by p[0..j-1]
        boolean[][] dp = new boolean[m + 1][n + 1];
        dp[0][0] = true;
        // ⑮ empty string can match patterns like a*, a*b*, a*b*c*
        for (int j = 2; j <= n; j += 2)
            if (p.charAt(j-1) == '*') dp[0][j] = dp[0][j-2];

        for (int i = 1; i <= m; i++) {
            for (int j = 1; j <= n; j++) {
                char pc = p.charAt(j-1), sc = s.charAt(i-1);
                if (pc == '*') {
                    // ⑯ zero occurrences of preceding char
                    dp[i][j] = dp[i][j-2];
                    // one or more: preceding char matches current s char
                    char prev = p.charAt(j-2);
                    if (prev == '.' || prev == sc)
                        dp[i][j] |= dp[i-1][j];
                } else {
                    // ⑰ direct match: '.' matches any, else exact match
                    dp[i][j] = (pc == '.' || pc == sc) && dp[i-1][j-1];
                }
            }
        }
        return dp[m][n];
    }
}`,

    code:`import java.util.*;

public class CombinatoricsDP {
    static final int MOD = 1_000_000_007;

    // ── Template 1: Pascal's triangle — precompute C(n,k) ──
    static long[][] buildPascal(int maxN) {
        long[][] C = new long[maxN + 1][maxN + 1];
        C[0][0] = 1;
        for (int i = 1; i <= maxN; i++) {
            C[i][0] = 1;
            for (int j = 1; j <= i; j++)
                // ① Pascal's recurrence with modulo
                C[i][j] = (C[i-1][j-1] + C[i-1][j]) % MOD;
        }
        return C;
    }

    // ── Template 2: Large nCr with modular inverse ──
    static long[] fact, inv;
    static void precompute(int n) {
        fact = new long[n + 1]; inv = new long[n + 1];
        fact[0] = 1;
        for (int i = 1; i <= n; i++) fact[i] = fact[i-1] * i % MOD;
        inv[n] = modPow(fact[n], MOD - 2, MOD); // ② Fermat's little theorem
        for (int i = n - 1; i >= 0; i++) inv[i] = inv[i+1] * (i+1) % MOD;
    }
    static long nCr(int n, int r) {
        if (r < 0 || r > n) return 0;
        return fact[n] * inv[r] % MOD * inv[n-r] % MOD; // ③
    }
    static long modPow(long b, long e, long m) {
        long res = 1; b %= m;
        for (; e > 0; e >>= 1) {
            if ((e & 1) == 1) res = res * b % m;
            b = b * b % m;
        }
        return res;
    }

    // ── Template 3: Unique paths in grid (m × n) ──
    static long uniquePaths(int m, int n) {
        // ④ dp[i][j] = number of paths to reach cell (i,j)
        // dp[i][j] = dp[i-1][j] + dp[i][j-1]
        long[] dp = new long[n]; // space-optimized to 1D
        Arrays.fill(dp, 1);     // ⑤ top row: only one way (go right)
        for (int i = 1; i < m; i++)
            for (int j = 1; j < n; j++)
                dp[j] = (dp[j] + dp[j-1]) % MOD; // ⑥ from top + from left
        return dp[n-1];
        // Also: C(m+n-2, m-1) directly
    }

    // ── Template 4: Catalan numbers ──
    static long catalan(int n) {
        // ⑦ C_n = C(2n, n) / (n+1)  — uses modular inverse
        // = C(2n,n) * modPow(n+1, MOD-2, MOD) % MOD
        // First few: 1,1,2,5,14,42,132,429,1430...
        long[][] C = buildPascal(2 * n);
        return C[2*n][n] * modPow(n + 1, MOD - 2, MOD) % MOD;
    }

    // ── Template 5: Dice rolls with target sum ──
    static int numRollsToTarget(int n, int k, int target) {
        // ⑧ dp[i][j] = ways to get sum j using i dice
        int[] dp = new int[target + 1];
        dp[0] = 1; // ⑨ 0 dice, sum 0: 1 way
        for (int die = 0; die < n; die++) {
            int[] ndp = new int[target + 1];
            for (int j = 0; j <= target; j++) {
                if (dp[j] == 0) continue;
                for (int face = 1; face <= k && j + face <= target; face++)
                    ndp[j + face] = (ndp[j + face] + dp[j]) % MOD; // ⑩
            }
            dp = ndp;
        }
        return dp[target];
    }

    // ── Template 6: Count BSTs with n nodes (Catalan) ──
    static long numTrees(int n) {
        // ⑪ dp[i] = number of structurally unique BSTs with i nodes
        // dp[i] = sum of dp[j-1] * dp[i-j] for j=1..i
        //         (j is root: j-1 nodes in left, i-j in right)
        long[] dp = new long[n + 1];
        dp[0] = 1; dp[1] = 1;
        for (int i = 2; i <= n; i++)
            for (int j = 1; j <= i; j++)
                dp[i] = (dp[i] + dp[j-1] * dp[i-j]) % MOD;
        return dp[n];
    }
}`,

    code:`import java.util.*;

public class UnboundedKnapsack {

    // ── Template 1: Unbounded knapsack — max value ──
    static int maxValue(int W, int[] wt, int[] val) {
        int[] dp = new int[W + 1]; // ① dp[w] = max value with capacity w
        for (int i = 0; i < wt.length; i++)       // ② outer: items
            for (int w = wt[i]; w <= W; w++)       // ③ inner: FORWARD (allows reuse!)
                dp[w] = Math.max(dp[w], dp[w - wt[i]] + val[i]);
        return dp[W];
    }

    // ── Template 2: Coin change — minimum coins (LC 322) ──
    static int minCoins(int[] coins, int amount) {
        int[] dp = new int[amount + 1];
        Arrays.fill(dp, amount + 1);   // ④ "infinity" sentinel
        dp[0] = 0;                     // ⑤ 0 coins needed for amount 0
        for (int c : coins)            // ⑥ outer: coins (order doesn't matter for min)
            for (int w = c; w <= amount; w++)
                dp[w] = Math.min(dp[w], dp[w - c] + 1); // ⑦ use coin c
        return dp[amount] > amount ? -1 : dp[amount]; // ⑧ unreachable check
    }

    // ── Template 3: Coin change 2 — count combinations (LC 518) ──
    // Each combination counted ONCE (order doesn't matter)
    static int countCombinations(int amount, int[] coins) {
        int[] dp = new int[amount + 1];
        dp[0] = 1;                     // ⑨ 1 way to make amount 0 (use nothing)
        for (int c : coins)            // ⑩ outer: coins — each coin processed fully
            for (int w = c; w <= amount; w++)
                dp[w] += dp[w - c];    // ⑪ add ways using coin c
        return dp[amount];
        // Key: outer=coins ensures each combination counted once
    }

    // ── Template 4: Combination sum IV — count permutations (LC 377) ──
    // Order MATTERS: [1,2] and [2,1] are different
    static int countPermutations(int[] nums, int target) {
        int[] dp = new int[target + 1];
        dp[0] = 1;
        for (int w = 1; w <= target; w++) // ⑫ outer: TARGET (each amount)
            for (int x : nums)            // ⑬ inner: numbers (try all as LAST element)
                if (w >= x) dp[w] += dp[w - x]; // ⑭ ways to reach w ending in x
        return dp[target];
        // Key: outer=target means "how many sequences of any length sum to w"
    }

    // ── Template 5: Perfect squares — min count (LC 279) ──
    static int numSquares(int n) {
        // ⑮ Treat perfect squares as coins: 1,4,9,16,...,floor(sqrt(n))^2
        int[] dp = new int[n + 1];
        Arrays.fill(dp, n + 1);   // "infinity"
        dp[0] = 0;
        for (int i = 1; i * i <= n; i++)     // ⑯ for each perfect square
            for (int w = i * i; w <= n; w++) // ⑰ forward loop (unbounded)
                dp[w] = Math.min(dp[w], dp[w - i*i] + 1);
        return dp[n];
    }

    // ── Template 6: Rod cutting — max revenue ──
    static int rodCutting(int[] price, int n) {
        // ⑱ dp[len] = max revenue from rod of length len
        // Can cut into any combination of pieces (unbounded on piece sizes)
        int[] dp = new int[n + 1];
        for (int len = 1; len <= n; len++)   // outer: lengths 1..n
            for (int cut = 1; cut <= len; cut++)  // try all first cuts
                dp[len] = Math.max(dp[len], price[cut-1] + dp[len - cut]);
        return dp[n];
    }
}`,

      {n:'⑫⑬',bg:'var(--a2)',c:'var(--a3)',t:'<strong>Permutations — outer=target:</strong> For each target amount w, we ask "how many sequences end in each number x?". The answer is dp[w-x] (all ways to make w-x) summed over all x. This treats [1,2] and [2,1] as different sequences — order matters.'},
      {n:'⑯⑰',bg:'var(--c2)',c:'var(--c3)',t:'<strong>Perfect squares insight:</strong> Treat each perfect square as a coin with value i². The minimum number of squares that sum to n is exactly coin change minimum with this coin set. The forward loop ensures squares can be reused.'}
    ],
    cx:{t:'O(n × W)',s:'O(W)',td:'n items, W capacity. Single 2D loop flattened to O(nW). Coin change: O(C × amount) where C = number of coins. Perfect squares: O(sqrt(n) × n).',sd:'1D dp array of size W+1 (or amount+1). Space-optimized from O(nW) to O(W).'},
    qs:[
      {d:'easy',n:'Coin change — minimum coins',nt:'dp[0]=0, rest=INF. Forward loop.',url:'https://leetcode.com/problems/coin-change/',ul:'LC 322'},
      {d:'easy',n:'Coin change 2 — count combinations',nt:'dp[0]=1. Outer=coins, inner=amount.',url:'https://leetcode.com/problems/coin-change-ii/',ul:'LC 518'},
      {d:'easy',n:'Unbounded knapsack — max value',nt:'Core template. Forward inner loop.',url:'https://www.geeksforgeeks.org/unbounded-knapsack-repetition-items-allowed/',ul:'GFG'},
      {d:'med',n:'Perfect squares — min count',nt:'Squares as coins. Forward loop.',url:'https://leetcode.com/problems/perfect-squares/',ul:'LC 279'},
      {d:'med',n:'Combination sum IV — count permutations',nt:'Outer=target, inner=nums. Order matters.',url:'https://leetcode.com/problems/combination-sum-iv/',ul:'LC 377'},
      {d:'med',n:'Integer break — maximize product',nt:'dp[i] = max product of i. Try all first splits.',url:'https://leetcode.com/problems/integer-break/',ul:'LC 343'},
      {d:'med',n:'Minimum ribbon cut (use exactly all length)',nt:'Variant: must reach exactly W, not just ≤W.',url:'https://www.geeksforgeeks.org/minimum-cuts-in-minimum-number-of-cuts/',ul:'GFG'},
      {d:'hard',n:'Rod cutting — max revenue',nt:'CLRS classic. dp[len] = max over all first cuts.',url:'https://www.geeksforgeeks.org/cutting-a-rod-dp-13/',ul:'GFG'},
      {d:'hard',n:'Minimum cost to cut a stick',nt:'Interval DP. Not pure unbounded but uses similar forward thinking.',url:'https://leetcode.com/problems/minimum-cost-to-cut-a-stick/',ul:'LC 1547'},
      {d:'cx',n:'Count ways to partition N using integers ≤ K',nt:'Partition function DP. dp[n][k] with bounded parts.',url:'https://codeforces.com/problemset/problem/1244/F',ul:'CF 1244F'}
    ],
    sim:{
      label:'Dry run: minCoins([1,3,4], amount=6)',
      steps:[
        {states:{coin:'init',w:'—',dp:'[0,∞,∞,∞,∞,∞,∞]'},arr:[0,1,2,3,4,5,6],hi:[0],log:'Init: dp[0]=0, dp[1..6]=7 ("infinity"=amount+1)'},
        {states:{coin:1,w:'1→6',dp:'[0,1,2,3,4,5,6]'},arr:[0,1,2,3,4,5,6],hi:[1,2,3,4,5,6],log:'Coin=1: forward w=1..6\ndp[1]=min(7,dp[0]+1)=1\ndp[2]=min(7,dp[1]+1)=2\ndp[3]=min(7,dp[2]+1)=3\ndp[4]=min(7,dp[3]+1)=4\ndp[5]=min(7,dp[4]+1)=5\ndp[6]=min(7,dp[5]+1)=6'},
        {states:{coin:3,w:'3→6',dp:'[0,1,2,1,2,3,2]'},arr:[0,1,2,3,4,5,6],hi:[3,4,5,6],log:'Coin=3: forward w=3..6\ndp[3]=min(3,dp[0]+1)=min(3,1)=1 ✓\ndp[4]=min(4,dp[1]+1)=min(4,2)=2 ✓\ndp[5]=min(5,dp[2]+1)=min(5,3)=3\ndp[6]=min(6,dp[3]+1)=min(6,2)=2 ✓'},
        {states:{coin:4,w:'4→6',dp:'[0,1,2,1,1,2,2]'},arr:[0,1,2,3,4,5,6],hi:[4,5,6],log:'Coin=4: forward w=4..6\ndp[4]=min(2,dp[0]+1)=min(2,1)=1 ✓\ndp[5]=min(3,dp[1]+1)=min(3,2)=2\ndp[6]=min(2,dp[2]+1)=min(2,3)=2 (no change)'},
        {states:{coin:'done',w:'—',dp:'[0,1,2,1,1,2,2]'},arr:[0,1,2,3,4,5,6],hi:[6],log:'dp[6] = 2 ✓\nOptimal: 3+3=6 or 4+... wait 3+3=2 coins!\nVerify: coin 3 used twice → 3+3=6, 2 coins.\nAnswer = 2 ✓',done:true}
      ]
    }
  }
];

function nb(p, on) {
  const b = document.createElement('button');
  b.className = 'nav-btn' + (on?' on':'');
  b.textContent = p.label;
  b.style.setProperty('--c', p.color);
  if(on) b.style.background = p.color;
  b.onclick = () => {
    document.querySelectorAll('.nav-btn').forEach((x,i)=>{x.classList.remove('on');x.style.background='';});
    b.classList.add('on'); b.style.background=p.color;
    document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
    document.getElementById('pane-'+p.id).classList.add('on');
  };
  return b;
}

function codeHtml(c){
  return c.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/(\/\/[^\n]*)/g,'<span class="cm">$1</span>')
    .replace(/\b(int|long|boolean|String|char|void|static|public|class|return|for|while|if|else|new|null|true|false|import|java|util|Arrays|Math|Map|HashMap|Queue|Deque|List|ArrayList|LinkedList|ArrayDeque|Integer|Scanner)\b/g,'<span class="kw">$1</span>')
    .replace(/\b([A-Z][a-zA-Z0-9]+)\b/g,'<span class="tp">$1</span>')
    .replace(/\b(\d+)\b/g,'<span class="nm">$1</span>');
}

const nav = document.getElementById('nav');
const panes = document.getElementById('panes');

P.forEach((p,pi) => {
  nav.appendChild(nb(p, pi===0));
  const pane = document.createElement('div');
  pane.id = 'pane-'+p.id;
  pane.className = 'pane' + (pi===0?' on':'');

  let simHtml = '';
  if(p.sim) {
    const s0 = p.sim.steps[0];
    const arrCells = p.sim.steps[0].arr.map((v,i)=>`<div class="ab" id="sim-${p.id}-ab-${i}">${typeof v==='object'?'['+v+']':v}</div>`).join('');
    const stateKeys = Object.keys(s0.states);
    const stateItems = stateKeys.map(k=>`<div class="si"><span class="sk">${k}</span><span class="sv" id="sim-${p.id}-sv-${k}" style="color:${p.color}">${s0.states[k]}</span></div>`).join('');
    simHtml = `
    <div class="sec">
      <div class="stitle">Interactive dry run</div>
      <div class="card prose" style="margin-bottom:8px">${p.sim.label}</div>
      <div class="sim-row">
        <div class="sim-box">
          <div class="sim-lbl">Array / state</div>
          <div class="arr-disp" id="sim-${p.id}-arr">${arrCells}</div>
          <div class="srow">${stateItems}</div>
        </div>
        <div class="sim-box">
          <div class="sim-lbl">Step log</div>
          <div class="log" id="sim-${p.id}-log">${s0.log}</div>
          <div id="sim-${p.id}-res"></div>
        </div>
      </div>
      <div class="ctl">
        <button onclick="simStep('${p.id}')"><i class="ti ti-arrow-right" style="font-size:13px" aria-hidden="true"></i> Next step</button>
        <button onclick="simReset('${p.id}')"><i class="ti ti-refresh" style="font-size:13px" aria-hidden="true"></i> Reset</button>
        <span class="ci" id="sim-${p.id}-info">Step 0 of ${p.sim.steps.length-1}</span>
      </div>
    </div>`;
  }

  pane.innerHTML = `
  <div class="sec">
    <div class="stitle">Problem &amp; intuition</div>
    <div class="card">
      <div class="prose" style="margin-bottom:10px">
        ${p.intuition.map(x=>`<div class="ins ${x.cls}" style="margin-bottom:8px"><strong>${x.t}:</strong> ${x.b}</div>`).join('')}
      </div>
      <div>${p.chips.map(c=>`<span class="chip c${c[0]}">${c[1]}</span>`).join('')}</div>
    </div>
  </div>
  <div class="sec">
    <div class="stitle">The 4-phase recipe</div>
    <div class="pgrid">
      ${p.phases.map(ph=>`<div class="pcard"><div class="pcard-n" style="color:${ph.col}">Phase ${ph.n}</div><div class="pcard-t">${ph.t}</div><div class="pcard-d">${ph.d}</div></div>`).join('')}
    </div>
  </div>
  <div class="sec">
    <div class="stitle">Annotated Java template</div>
    <div class="card">
      <div class="code-wrap"><div class="code-hdr"><span>Java 17</span><span>${p.id}.java</span></div><div class="code-body">${codeHtml(p.code)}</div></div>
      <div class="ann-list">
        ${p.anns.map(a=>`<div class="ann" style="border-left-color:${a.bg==='var(--p2)'?p.color:a.bg.includes('t2')?'#1D9E75':a.bg.includes('a2')?'#EF9F27':a.bg.includes('c2')?'#D85A30':a.bg.includes('b2')?'#378ADD':'#639922'}"><div class="ann-n" style="background:${a.bg};color:${a.c}">${a.n}</div><div class="ann-t">${a.t}</div></div>`).join('')}
      </div>
    </div>
  </div>
  ${simHtml}
  <div class="sec">
    <div class="stitle">Time &amp; space complexity</div>
    <div class="cxg">
      <div class="cxc"><div class="cxl">Time</div><div class="cxv">${p.cx.t}</div><div class="cxd">${p.cx.td}</div></div>
      <div class="cxc"><div class="cxl">Space</div><div class="cxv">${p.cx.s}</div><div class="cxd">${p.cx.sd}</div></div>
    </div>
  </div>
  <div class="sec">
    <div class="stitle">Questions — easy to complex</div>
    <ul class="ql">
      ${p.qs.map(q=>`<li class="qi"><span class="qd ${q.d==='cx'?'cx':q.d}">${q.d==='cx'?'complex':q.d}</span><div class="qb"><div class="qn">${q.n}</div><div class="qnt">${q.nt}</div><a href="${q.url}" target="_blank"><i class="ti ti-external-link" style="font-size:11px" aria-hidden="true"></i> ${q.ul}</a></div></li>`).join('')}
    </ul>
    <div style="margin-top:12px"><button class="ask-btn" onclick="sendPrompt('Deep dive into ${p.label} pattern — give me the hardest question from this list solved step by step in Striver style with Java code')">Hardest problem deep dive ↗</button></div>
  </div>`;
  panes.appendChild(pane);
});

const simState = {};
P.forEach(p => { if(p.sim) simState[p.id] = 0; });

function simRender(id) {
  const p = P.find(x=>x.id===id);
  const step = simState[id];
  const s = p.sim.steps[Math.min(step, p.sim.steps.length-1)];
  Object.keys(s.states).forEach(k => {
    const el = document.getElementById(`sim-${id}-sv-${k}`);
    if(el) el.textContent = s.states[k];
  });
  const arrEl = document.getElementById(`sim-${id}-arr`);
  if(arrEl && s.arr) {
    const boxes = arrEl.querySelectorAll('.ab');
    boxes.forEach((b,i) => {
      b.className = 'ab';
      if(s.hi && s.hi.includes(i)) b.classList.add('hi');
      if(s.done) b.classList.add('done');
    });
  }
  const logEl = document.getElementById(`sim-${id}-log`);
  if(logEl) {
    logEl.textContent = p.sim.steps.slice(0,step+1).map(x=>x.log).join('\n\n');
    logEl.scrollTop = logEl.scrollHeight;
  }
  const info = document.getElementById(`sim-${id}-info`);
  if(info) info.textContent = `Step ${step} of ${p.sim.steps.length-1}`;
  const res = document.getElementById(`sim-${id}-res`);
  if(res) {
    if(s.done) res.innerHTML = `<div class="res"><i class="ti ti-check" aria-hidden="true"></i> Trace complete</div>`;
    else res.innerHTML = '';
  }
}
function simStep(id) {
  const p = P.find(x=>x.id===id);
  if(simState[id] < p.sim.steps.length-1) { simState[id]++; simRender(id); }
}
function simReset(id) { simState[id]=0; simRender(id); }
P.forEach(p => { if(p.sim) simRender(p.id); });
</script>
