<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java Mastery — OOP Cold Open Slide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* Reset & Viewport Constraints */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #000;
      color: #e6edf3;
      font-family: 'JetBrains Mono', monospace;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 1920x1080 Stage with Responsive Scaling */
    .stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      aspect-ratio: 16 / 9;
      max-width: 100vw;
      max-height: 100vh;
      overflow: hidden;
    }

    /* Base Scene Layout (Full Bleed Overlay) */
    .scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease-in-out;
    }

    .scene.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* State 1: Pure Black Background + Typewriter Text */
    .scene-text {
      background-color: #000000;
      padding: 4rem;
      text-align: center;
    }

    .typewriter-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      width: 100%;
      max-width: 1600px;
    }

    .type-line {
      font-size: clamp(2rem, 3.5vw, 4.2rem);
      font-weight: 700;
      color: #e6edf3;
      line-height: 1.3;
      letter-spacing: -0.01em;
      white-space: nowrap;
      min-height: 1.3em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .type-line.subtitle {
      font-size: clamp(1.4rem, 2.2vw, 2.6rem);
      font-weight: 500;
      color: #a3b3c2;
    }

    /* Blinking Cursor Span */
    .cursor {
      display: inline-block;
      width: 0.6em;
      height: 1.1em;
      background-color: #e6edf3;
      margin-left: 0.25rem;
      vertical-align: middle;
      animation: blink 0.8s infinite steps(2, start);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* State 2: Solid White Background + SVG Channel Logo Placeholder */
    .scene-flash {
      background-color: #ffffff;
      color: #000000;
    }

    .logo-container {
      width: 300px;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #channel_logo_svg {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .placeholder-box {
      width: 100%;
      height: 100%;
      border: 3px dashed #94a3b8;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #64748b;
      font-size: 1.1rem;
      font-weight: 700;
      background-color: #f8fafc;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .placeholder-box:hover {
      border-color: #3b82f6;
      color: #2563eb;
      background-color: #eff6ff;
    }

    .placeholder-box svg {
      width: 48px;
      height: 48px;
      stroke: currentColor;
    }

    /* Interactive Control Bar (HUD overlay for testing/preview) */
    .controls-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 100;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .control-btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 8px 16px;
      border-radius: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .control-btn:hover {
      background: #334155;
      border-color: #94a3b8;
    }

    .control-btn.active {
      background: #3b82f6;
      border-color: #60a5fa;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="stage" id="stage">
    
    <!-- State 1: Black Background + Typewriter Text -->
    <section class="scene scene-text active" id="scene-text">
      <div class="typewriter-container">
        <div class="type-line" id="line1"></div>
        <div class="type-line subtitle" id="line2"></div>
      </div>
    </section>

    <!-- State 2: Solid White Background + Channel Logo Placeholder -->
    <section class="scene scene-flash" id="scene-flash">
      <div class="logo-container">
        <div id="channel_logo_svg">
          <div class="placeholder-box" id="logo-uploader" onclick="triggerLogoUpload()">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
            </svg>
            <span>Upload: Channel Logo</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Interactive HUD Control Bar -->
    <div class="controls-bar">
      <button class="control-btn active" id="btn-scene-text" onclick="showScene('text')">Scene 1: Text (.scene-text)</button>
      <button class="control-btn" id="btn-scene-flash" onclick="showScene('flash')">Scene 2: Flash (.scene-flash)</button>
      <button class="control-btn" onclick="restartTypewriter()">↺ Replay Typewriter</button>
    </div>

  </div>

  <input type="file" id="file-input" accept="image/svg+xml,image/png,image/jpeg" style="display: none;" onchange="handleFileUpload(event)">

  <script>
    // Asset Configuration Object
    const assets = {
      channelLogo: "UPLOAD_SVG_HERE"
    };

    // Text Content Definitions
    const TEXT_LINE_1 = "What is Object-Oriented Programming?";
    const TEXT_LINE_2 = "— Asked in literally every Java interview. Ever.";

    // Typewriter Engine Variables
    let currentLine = 1;
    let charIndex = 0;
    let typingTimer = null;

    // DOM Elements
    const elLine1 = document.getElementById('line1');
    const elLine2 = document.getElementById('line2');
    const sceneText = document.getElementById('scene-text');
    const sceneFlash = document.getElementById('scene-flash');
    const logoContainer = document.getElementById('channel_logo_svg');

    // Create Blinking Cursor Element
    const cursor = document.createElement('span');
    cursor.className = 'cursor';

    // Start Typewriter Effect
    function startTypewriter() {
      clearTimeout(typingTimer);
      elLine1.innerHTML = '';
      elLine2.innerHTML = '';
      charIndex = 0;
      currentLine = 1;
      
      elLine1.appendChild(cursor);
      typeNextChar();
    }

    function typeNextChar() {
      if (currentLine === 1) {
        if (charIndex < TEXT_LINE_1.length) {
          const textNode = document.createTextNode(TEXT_LINE_1.charAt(charIndex));
          elLine1.insertBefore(textNode, cursor);
          charIndex++;
          typingTimer = setTimeout(typeNextChar, 50);
        } else {
          // Pause before starting line 2
          currentLine = 2;
          charIndex = 0;
          typingTimer = setTimeout(() => {
            elLine2.appendChild(cursor);
            typeNextChar();
          }, 400);
        }
      } else if (currentLine === 2) {
        if (charIndex < TEXT_LINE_2.length) {
          const textNode = document.createTextNode(TEXT_LINE_2.charAt(charIndex));
          elLine2.insertBefore(textNode, cursor);
          charIndex++;
          typingTimer = setTimeout(typeNextChar, 40);
        }
      }
    }

    function restartTypewriter() {
      showScene('text');
      startTypewriter();
    }

    // Toggle Scene State (.scene-text vs .scene-flash)
    function showScene(sceneName) {
      if (sceneName === 'text') {
        sceneText.classList.add('active');
        sceneFlash.classList.remove('active');
        document.getElementById('btn-scene-text').classList.add('active');
        document.getElementById('btn-scene-flash').classList.remove('active');
      } else if (sceneName === 'flash') {
        sceneText.classList.remove('active');
        sceneFlash.classList.add('active');
        document.getElementById('btn-scene-text').classList.remove('active');
        document.getElementById('btn-scene-flash').classList.active = false;
        document.getElementById('btn-scene-flash').classList.add('active');
      }
    }

    // Handle Channel Logo Rendering
    function renderChannelLogo() {
      if (assets.channelLogo && assets.channelLogo !== "UPLOAD_SVG_HERE") {
        if (assets.channelLogo.trim().startsWith('<svg')) {
          logoContainer.innerHTML = assets.channelLogo;
        } else {
          logoContainer.innerHTML = `<img src="${assets.channelLogo}" alt="Channel Logo" style="width:100%; height:100%; object-fit:contain;" />`;
        }
      }
    }

    // Upload Handler for Testing SVG / Image Placement
    function triggerLogoUpload() {
      document.getElementById('file-input').click();
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        assets.channelLogo = e.target.result;
        renderChannelLogo();
      };
      
      if (file.type === "image/svg+xml") {
        reader.readAsText(file);
      } else {
        reader.readAsDataURL(file);
      }
    }

    // Hotkey Controls (Spacebar / Right Arrow toggles scenes)
    document.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'ArrowRight') {
        if (sceneText.classList.contains('active')) {
          showScene('flash');
        } else {
          showScene('text');
        }
      } else if (e.key === 'ArrowLeft') {
        showScene('text');
      } else if (e.key === 'r' || e.key === 'R') {
        restartTypewriter();
      }
    });

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', () => {
      renderChannelLogo();
      startTypewriter();
    });
  </script>
</body>
</html>
