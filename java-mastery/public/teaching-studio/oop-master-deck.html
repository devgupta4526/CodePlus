<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OOP Mastery — Full 21-Slide Interactive Studio Deck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #05070a;
      color: #e6edf3;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .controls-header {
      width: 100%;
      max-width: 1920px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: #00ff9d;
      text-shadow: 0 0 12px rgba(0, 255, 157, 0.4);
    }

    .slide-counter {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: #7c8cf8;
      background: #161b22;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #30363d;
    }

    .nav-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      background: #161b22;
      color: #ffffff;
      border: 1px solid #30363d;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .btn:hover, .btn.active {
      background: #21262d;
      border-color: #00ff9d;
      color: #00ff9d;
    }

    .stage-frame {
      width: 100vw;
      max-width: 1920px;
      height: 56.25vw;
      max-height: 1080px;
      border: 2px solid #30363d;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="controls-header">
    <div class="title">🎬 OOP in Java — 21-Slide Teaching Studio Deck</div>
    <div class="slide-counter" id="counterDisplay">Slide 1 / 21</div>
    <div class="nav-btns">
      <button class="btn" onclick="prevSlide()">◀ Prev</button>
      <button class="btn" onclick="nextSlide()">Next ▶</button>
    </div>
  </div>

  <div class="stage-frame">
    <iframe id="studioFrame" src="/admin/studio/oop-fundamentals"></iframe>
  </div>

  <script>
    console.log("OOP 21-Slide Master Deck Loaded");
  </script>
</body>
</html>
