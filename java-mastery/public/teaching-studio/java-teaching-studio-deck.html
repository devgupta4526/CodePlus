<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java Teaching Studio — Interactive Slide Deck</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080c10;
      color: #e6edf3;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .controls-header {
      width: 100%;
      max-width: 1920px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #61dafb;
    }

    .nav-btns {
      display: flex;
      gap: 10px;
    }

    .btn {
      background: #161b22;
      color: #ffffff;
      border: 1px solid #30363d;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #21262d;
      border-color: #61dafb;
    }

    .stage-frame {
      width: 100vw;
      max-width: 1920px;
      height: 56.25vw;
      max-height: 1080px;
      border: 2px solid #30363d;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="controls-header">
    <div class="title">🎬 Java Teaching Studio Deck — Part 1 & Part 2</div>
    <div class="nav-btns">
      <button class="btn" onclick="loadScene(1)">Scene 1: Cold Open</button>
      <button class="btn" onclick="loadScene(2)">Scene 2: Interview Hook</button>
      <button class="btn" onclick="loadScene(3)">Scene 3: Split Screen</button>
      <button class="btn" onclick="loadScene(4)">Scene 4: Roadmap</button>
      <button class="btn" onclick="loadScene(5)">Scene 5: Whiteboard Intro</button>
    </div>
  </div>

  <div class="stage-frame">
    <iframe id="slideFrame" src="scene-1-cold-open.html"></iframe>
  </div>

  <script>
    const scenes = [
      'scene-1-cold-open.html',
      'lesson-template-interview.html',
      'scene-3-split-screen.html',
      'scene-4-roadmap.html',
      'scene-5-whiteboard-intro.html'
    ];
    let currentIndex = 0;

    function loadScene(num) {
      currentIndex = num - 1;
      document.getElementById('slideFrame').src = scenes[currentIndex];
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        currentIndex = (currentIndex + 1) % scenes.length;
        loadScene(currentIndex + 1);
      } else if (e.key === 'ArrowLeft') {
        currentIndex = (currentIndex - 1 + scenes.length) % scenes.length;
        loadScene(currentIndex + 1);
      }
    });
  </script>
</body>
</html>
