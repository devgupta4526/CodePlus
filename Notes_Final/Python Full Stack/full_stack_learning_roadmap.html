
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.rm-wrap{padding:1rem 0}
.rm-header{margin-bottom:1.5rem}
.rm-header h1{font-size:22px;font-weight:500;color:var(--text-primary);margin-bottom:4px}
.rm-header p{font-size:14px;color:var(--text-secondary)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1.25rem}
.filter-btn{font-size:12px;padding:4px 12px;border-radius:20px;border:0.5px solid var(--border-strong);background:transparent;color:var(--text-secondary);cursor:pointer;transition:all .15s}
.filter-btn.active{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.progress-bar{background:var(--surface-1);border:0.5px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:1.25rem;display:flex;align-items:center;gap:12px}
.pb-label{font-size:12px;color:var(--text-secondary);white-space:nowrap}
.pb-track{flex:1;height:6px;background:var(--surface-0);border-radius:3px;overflow:hidden}
.pb-fill{height:100%;background:var(--fill-accent);border-radius:3px;transition:width .4s ease}
.pb-count{font-size:12px;font-weight:500;color:var(--text-accent);white-space:nowrap}
.section{margin-bottom:1rem;border:0.5px solid var(--border);border-radius:12px;overflow:hidden}
.section-header{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;background:var(--surface-1);user-select:none}
.section-header:hover{background:var(--surface-0)}
.sec-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sec-info{flex:1;min-width:0}
.sec-title{font-size:15px;font-weight:500;color:var(--text-primary)}
.sec-sub{font-size:12px;color:var(--text-secondary);margin-top:1px}
.sec-meta{display:flex;align-items:center;gap:8px;flex-shrink:0}
.level-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500}
.level-basic{background:#E6F1FB;color:#0C447C}
.level-inter{background:#EAF3DE;color:#27500A}
.level-adv{background:#FAEEDA;color:#633806}
.chevron{font-size:14px;color:var(--text-muted);transition:transform .2s}
.chevron.open{transform:rotate(180deg)}
.section-body{display:none;border-top:0.5px solid var(--border)}
.section-body.open{display:block}
.topic-list{padding:8px}
.topic-item{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:background .1s}
.topic-item:hover{background:var(--surface-0)}
.topic-check{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--border-strong);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.topic-check.done{background:var(--fill-accent);border-color:var(--fill-accent)}
.topic-check.done::after{content:'✓';font-size:11px;color:white;font-weight:600}
.topic-info{flex:1;min-width:0}
.topic-name{font-size:14px;color:var(--text-primary);font-weight:500}
.topic-subs{font-size:12px;color:var(--text-secondary);margin-top:3px;line-height:1.5}
.topic-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.link-btn{font-size:11px;padding:2px 8px;border-radius:10px;border:0.5px solid var(--border);color:var(--text-accent);background:var(--bg-accent);text-decoration:none;cursor:pointer}
.link-btn:hover{background:var(--fill-accent);color:white}
.topic-level{font-size:10px;padding:1px 6px;border-radius:6px;flex-shrink:0;margin-top:3px}
.subtopic-group{margin:0 0 0 18px;padding:0 0 4px}
.subtopic-item{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:6px;cursor:pointer;transition:background .1s}
.subtopic-item:hover{background:var(--surface-0)}
.sub-check{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--border-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s}
.sub-check.done{background:#1baf7a;border-color:#1baf7a}
.sub-check.done::after{content:'✓';font-size:9px;color:white;font-weight:600}
.sub-name{font-size:13px;color:var(--text-secondary)}
.sec-progress{width:60px;height:4px;background:var(--surface-0);border-radius:2px;overflow:hidden}
.sec-prog-fill{height:100%;border-radius:2px;transition:width .3s}
.expand-toggle{font-size:11px;color:var(--text-accent);cursor:pointer;padding:2px 6px;border-radius:4px;border:none;background:transparent}
.expand-toggle:hover{background:var(--bg-accent)}
.search-box{width:100%;padding:8px 12px;border:0.5px solid var(--border-strong);border-radius:var(--radius);font-size:14px;color:var(--text-primary);background:var(--surface-2);margin-bottom:1rem;outline:none}
.search-box:focus{border-color:var(--border-accent)}
.hidden{display:none}
</style>

<div class="rm-wrap">
<div class="rm-header">

</div>

<input class="search-box" type="text" placeholder="Search topics..." id="searchBox" oninput="filterTopics()">

<div class="progress-bar">

</div>

<div class="filters" id="filterBar"></div>
<div id="roadmapContainer"></div>
</div>

const TAGS = ['All',...[...new Set(DATA.map(d=>d.tag))]];
let activeTag='All', checked={}, openSections={}, expandedTopics={};

function save(){try{localStorage.setItem('rm_v2',JSON.stringify({checked,openSections,expandedTopics}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('rm_v2')||'{}');checked=d.checked||{};openSections=d.openSections||{};expandedTopics=d.expandedTopics||{}}catch(e){}}

function countAll(){
  let total=0,done=0;
  DATA.forEach(s=>s.topics.forEach(t=>{
    t.subs.forEach(sub=>{
      total++;
      if(checked[s.id+'__'+t.name+'__'+sub])done++;
    });
  }));
  return{total,done};
}

function updateGlobalProgress(){
  const{total,done}=countAll();
  document.getElementById('mainPbFill').style.width=(total?done/total*100:0)+'%';
  document.getElementById('mainPbCount').textContent=done+' / '+total;
}

function sectionProgress(s){
  let total=0,done=0;
  s.topics.forEach(t=>t.subs.forEach(sub=>{total++;if(checked[s.id+'__'+t.name+'__'+sub])done++;}));
  return{total,done};
}

function renderFilters(){
  const bar=document.getElementById('filterBar');
  bar.innerHTML=TAGS.map(t=>`<button class="filter-btn${t===activeTag?' active':''}" onclick="setTag('${t}')">${t}</button>`).join('');
}

function setTag(t){activeTag=t;renderFilters();renderRoadmap();}

function filterTopics(){renderRoadmap();}

  const filtered=DATA.filter(s=>activeTag==='All'||s.tag===activeTag);
  
  container.innerHTML=filtered.map(s=>{
    const {total,done}=sectionProgress(s);
    const pct=total?Math.round(done/total*100):0;
    const isOpen=openSections[s.id];
    const levelMap={basic:'Basic',inter:'Intermediate',adv:'Advanced'};
    const levelClass={basic:'level-basic',inter:'level-inter',adv:'level-adv'};
    
    const topicsHtml=s.topics.map(t=>{
      const nameMatch=!q||t.name.toLowerCase().includes(q)||t.subs.some(sub=>sub.toLowerCase().includes(q))||s.title.toLowerCase().includes(q);
      if(!nameMatch)return '';
      const isExpanded=expandedTopics[s.id+'__'+t.name];
      const allDone=t.subs.every(sub=>checked[s.id+'__'+t.name+'__'+sub]);
      const linkHtml=t.links.map(({l,u})=>u?`<a class="link-btn" href="${u}" target="_blank" rel="noopener">${l}</a>`:`<span class="link-btn" onclick="event.stopPropagation();window.sendPrompt&&sendPrompt('Create a comprehensive DOCX study guide on ${t.name} for ${s.title} covering all subtopics with code examples and explanations')" title="Generate study guide">📄 ${l}</span>`).join('');
      
      const subsHtml=isExpanded?`<div class="subtopic-group">${t.subs.map(sub=>{
        const key=s.id+'__'+t.name+'__'+sub;
        const done=checked[key];
        return`<div class="subtopic-item" onclick="event.stopPropagation();toggleSub('${key}')"><div class="sub-check${done?' done':''}"></div><span class="sub-name">${sub}</span></div>`;
      }).join('')}</div>`:''
      
      return`<div class="topic-item" onclick="toggleExpand('${s.id}','${t.name}')">
        <div class="topic-check${allDone?' done':''}" onclick="event.stopPropagation();toggleAllSubs('${s.id}','${t.name}')"></div>
        <div class="topic-info">
          <div class="topic-name">${t.name} <span style="font-size:11px;color:var(--text-muted)">${isExpanded?'▲':'▼'} ${t.subs.length} subtopics</span></div>
          ${isExpanded?`<div class="topic-subs">${t.subs.slice(0,2).join(' · ')}${t.subs.length>2?` · +${t.subs.length-2} more`:''}</div>`:``}
          ${isExpanded?`<div class="topic-links">${linkHtml}</div>`:``}
        </div>
      </div>${subsHtml}`;
    }).join('');
    
    if(q&&!topicsHtml.trim())return'';
    
    return`<div class="section" id="sec_${s.id}">
      <div class="section-header" onclick="toggleSection('${s.id}')">
        <div class="sec-icon" style="background:${s.color}22">${s.icon}</div>
        <div class="sec-info">
          <div class="sec-title">${s.title}</div>
          <div class="sec-sub">${s.sub}</div>
        </div>
        <div class="sec-meta">
          <div>
            <div class="sec-progress"><div class="sec-prog-fill" style="width:${pct}%;background:${s.color}"></div></div>
            <div style="font-size:10px;color:var(--text-muted);text-align:right;margin-top:2px">${done}/${total}</div>
          </div>
          <span class="level-badge ${levelClass[s.level]}">${levelMap[s.level]}</span>
          <span class="chevron${isOpen?' open':''}"><i class="ti ti-chevron-down"></i></span>
        </div>
      </div>
      <div class="section-body${isOpen?' open':''}" id="body_${s.id}">
        <div class="topic-list">${topicsHtml||'<p style="font-size:13px;color:var(--text-muted);padding:12px">No topics match your search.</p>'}</div>
      </div>
    </div>`;
  }).join('');
  
  updateGlobalProgress();
}

function toggleSection(id){
  openSections[id]=!openSections[id];
  save();renderRoadmap();
  setTimeout(()=>{const el=document.getElementById('sec_'+id);if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'})},50);
}

function toggleExpand(sid,tname){
  const key=sid+'__'+tname;
  expandedTopics[key]=!expandedTopics[key];
  save();renderRoadmap();
}

function toggleSub(key){
  checked[key]=!checked[key];
  save();renderRoadmap();
}

function toggleAllSubs(sid,tname){
  const s=DATA.find(d=>d.id===sid);
  const t=s&&s.topics.find(tp=>tp.name===tname);
  if(!t)return;
  const allDone=t.subs.every(sub=>checked[sid+'__'+tname+'__'+sub]);
  t.subs.forEach(sub=>{checked[sid+'__'+tname+'__'+sub]=!allDone;});
  save();renderRoadmap();
}

load();renderFilters();renderRoadmap();
</script>
